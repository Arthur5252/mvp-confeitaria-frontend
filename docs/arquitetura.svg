<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, Arial, sans-serif">
  <title id="titulo">Arquitetura do sistema de compras para confeitaria</title>
  <desc id="descricao">O usuário acessa o frontend React, que chama a API FastAPI por REST. A API grava no SQLite e consulta a API externa OCR.space para ler etiquetas.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#ffffff"/>

  <!-- Usuário -->
  <rect x="30" y="150" width="170" height="90" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="115" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Usuário</text>
  <text x="115" y="211" text-anchor="middle" font-size="13" fill="#374151">celular ou desktop</text>

  <!-- Frontend -->
  <rect x="270" y="130" width="200" height="130" rx="12" fill="#fde8ef" stroke="#7c3f58" stroke-width="2"/>
  <text x="370" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#5e2e42">Frontend (Interface)</text>
  <text x="370" y="190" text-anchor="middle" font-size="13" fill="#374151">React + Vite (PWA)</text>
  <text x="370" y="210" text-anchor="middle" font-size="13" fill="#374151">Nginx em container Docker</text>
  <text x="370" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#5e2e42">porta 5173</text>

  <!-- Backend -->
  <rect x="560" y="130" width="200" height="130" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="660" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">Backend (API)</text>
  <text x="660" y="190" text-anchor="middle" font-size="13" fill="#374151">FastAPI + Swagger</text>
  <text x="660" y="210" text-anchor="middle" font-size="13" fill="#374151">Container Docker</text>
  <text x="660" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">porta 8000</text>

  <!-- Banco -->
  <rect x="560" y="330" width="200" height="80" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="660" y="364" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Banco de dados</text>
  <text x="660" y="388" text-anchor="middle" font-size="13" fill="#374151">SQLite (volume Docker)</text>

  <!-- API externa -->
  <rect x="560" y="8" width="200" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="660" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">API externa</text>
  <text x="660" y="60" text-anchor="middle" font-size="13" fill="#374151">OCR.space (gratuita)</text>

  <!-- Setas -->
  <line x1="200" y1="195" x2="268" y2="195" stroke="#374151" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="234" y="185" text-anchor="middle" font-size="12" fill="#374151">HTTP</text>

  <line x1="470" y1="195" x2="558" y2="195" stroke="#374151" stroke-width="2.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="514" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">REST</text>
  <text x="514" y="214" text-anchor="middle" font-size="12" fill="#374151">JSON + JWT</text>

  <line x1="660" y1="260" x2="660" y2="328" stroke="#374151" stroke-width="2.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="672" y="300" font-size="12" fill="#374151">SQL (SQLAlchemy)</text>

  <line x1="660" y1="128" x2="660" y2="80" stroke="#374151" stroke-width="2.5" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <text x="674" y="108" font-size="12" fill="#374151">foto da etiqueta → texto</text>

  <!-- Legenda -->
  <text x="30" y="310" font-size="13" font-weight="700" fill="#111827">Fluxo de escaneamento de etiqueta</text>
  <text x="30" y="334" font-size="12" fill="#374151">1. A interface envia a foto para a API (POST /ocr/escanear).</text>
  <text x="30" y="354" font-size="12" fill="#374151">2. A API chama o OCR.space; a chave fica só no servidor.</text>
  <text x="30" y="374" font-size="12" fill="#374151">3. A API interpreta o texto (nome, preço, atacado) e devolve.</text>
  <text x="30" y="394" font-size="12" fill="#374151">4. O usuário confirma e a API grava o preço no SQLite.</text>
</svg>
