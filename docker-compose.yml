# Orquestra os dois componentes desenvolvidos do MVP (Interface + API) para
# facilitar a demonstração/execução local e no notebook de hospedagem.
# Requer o repositório confeitaria-backend clonado como pasta irmã:
#
#   projeto/
#     confeitaria-frontend/   <- este repositório (contém este arquivo)
#     confeitaria-backend/
#
services:
  backend:
    build:
      context: ../confeitaria-backend
    ports:
      - "8000:8000"
    env_file:
      - ../confeitaria-backend/.env
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
