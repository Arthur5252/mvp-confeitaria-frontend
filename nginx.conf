server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota não encontrada cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
